[project]
name = "oura-mcp-server"
version = "0.1.0"
description = "MCP server for Oura Ring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "mcp",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "fastapi[standard]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
